<!doctype html>
<html
  lang="en"
  data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Background","default":"#FFFFFF"},
  {"id":"color-ink","type":"color","label":"Text","default":"#111111"},
  {"id":"color-agent","type":"color","label":"Agent accent","default":"#C6F432"},
  {"id":"color-human","type":"color","label":"Human blue","default":"#2B4CFF"},
  {"id":"font-display","type":"string","label":"Display font","default":"Bricolage Grotesque"}
]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #ffffff;
        --ink: #111111;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .ground {
        position: absolute;
        inset: 0;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1920"
      data-height="1080"
    >
      <div class="ground"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="tension" data-composition-id="tension" data-composition-src="compositions/tension.html" data-start="2.5" data-duration="3.5" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="6" data-duration="2.7" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="thread" data-composition-id="thread" data-composition-src="compositions/thread.html" data-start="8.7" data-duration="11.3" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="payoff" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="20" data-duration="6" data-track-index="5" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="claim" data-composition-id="claim" data-composition-src="compositions/claim.html" data-start="26" data-duration="2" data-track-index="6" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 6"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="28" data-duration="3" data-track-index="7" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 7"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
